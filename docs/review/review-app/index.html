<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>図形のまとまり確認</title><link rel="stylesheet" href="/style.css"></head>
<body><main><header><div><h1>図形のまとまり確認</h1><p id="progress">読み込み中</p></div><div class="tools"><button id="export">JSONを書き出す</button><button id="import-toggle">前回の結果を読み込む</button></div></header>
<div id="save-status" role="status">読み込み中</div>
<section id="import-panel" hidden><h2>以前の確認結果を読み込む</h2><p>初回画面の「確認結果を取り出す」の文章、または書き出したJSONを貼り付けるかファイルを選択してください。</p><textarea id="import-text" rows="5" placeholder="F1: 4+5 / 1+2+3 / 6+7 (確認済み)"></textarea><div class="tools"><input type="file" id="import-file" accept=".json,.txt,application/json,text/plain"><button id="import-apply">取り込む</button></div><p id="import-status" role="status"></p></section>
<nav id="figure-nav" aria-label="図形一覧"></nav>
<section id="editor" hidden><div class="section-title"><h2 id="figure-title"></h2><span id="figure-status"></span></div><div class="boards"><figure><figcaption>元の図形</figcaption><div id="silhouette" class="drawing"></div></figure><figure><figcaption>部品番号</figcaption><div id="pieces" class="drawing"></div></figure><figure><figcaption>分割案</figcaption><div id="grouped" class="drawing"></div></figure></div>
<label for="expression">まとまりの式</label><input id="expression" type="text" spellcheck="false" autocomplete="off" maxlength="1000"><p id="expression-help">+ で結合、/ で区切る。分割した部品は a・b の番号で指定できます。</p><p id="error" role="status"></p><p id="cut-note"></p><label for="note">修正メモ（任意）</label><textarea id="note" rows="2" maxlength="10000"></textarea><div class="actions"><button id="prev">前へ</button><button id="next">次へ（未確認のまま）</button><button id="confirm" class="primary">確認して次へ</button></div></section>
<div class="bottom"><button id="retry" hidden>保存を再試行</button><button id="backup" hidden>未保存データをJSONで退避</button><button id="reload-saved" hidden>退避してMacの保存版を読み込む</button></div>
</main><script src="/region-editor-model.js"></script><script src="/client.js"></script></body></html>
